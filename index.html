<style>
:root{
  --ink:#0a1128;
  --navy:#152357;
  --navy-2:#1c2f6e;
  --paper:#f4efe2;
  --paper-2:#e9e1cd;
  --teal:#2fbfa1;
  --teal-dim:#1c8c76;
  --amber:#e8a33d;
  --crisis:#d6483f;
  --crisis-dim:#8f2c27;
  --gold:#c9a227;
  --ink-line:#33427c;
  --muted:#9aa6cf;
  --white:#f8f7f2;
  --radius:14px;
  font-family:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top, #14204d 0%, var(--ink) 55%);
  color:var(--white);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#app{
  max-width:640px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--gold);
}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--teal); color:var(--ink);}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--navy-2); border-radius:4px;}

/* ---------- shared layout ---------- */
.screen{
  padding:22px 20px 100px;
  animation:fadeIn .35s ease;
  flex:1;
}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px;
  border-bottom:1px solid var(--ink-line);
  position:sticky; top:0; z-index:20;
  background:rgba(10,17,40,0.92);
  backdrop-filter:blur(6px);
}
.topbar .brand{display:flex; align-items:center; gap:9px;}
.topbar .brand svg{width:26px; height:26px;}
.topbar .brand-name{font-size:13px; font-weight:600; letter-spacing:0.04em;}
.topbar .brand-name small{display:block; font-size:9px; color:var(--muted); font-weight:400; letter-spacing:0.1em;}
.back-btn{
  background:none; border:1px solid var(--ink-line); color:var(--muted);
  border-radius:8px; padding:6px 12px; font-size:12px;
}
.back-btn:hover{color:var(--white); border-color:var(--muted);}

/* ---------- buttons ---------- */
.btn{
  display:block; width:100%; text-align:left; border:none; border-radius:12px;
  padding:16px 18px; font-size:15px; font-weight:600; color:var(--white);
  background:var(--navy-2); border:1px solid var(--ink-line);
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
  position:relative; overflow:hidden;
}
.btn:hover{transform:translateY(-1px); border-color:var(--teal);}
.btn:active{transform:translateY(0px) scale(.99);}
.btn .sub{display:block; font-weight:400; font-size:12px; color:var(--muted); margin-top:3px;}
.btn-primary{
  background:linear-gradient(135deg, var(--teal) 0%, var(--teal-dim) 100%);
  color:var(--ink); border:none;
}
.btn-primary .sub{color:#0a3a30;}
.btn-primary:hover{border-color:transparent; filter:brightness(1.05);}
.btn-amber{background:linear-gradient(135deg, var(--amber) 0%, #c47f22 100%); color:#3a2400; border:none;}
.btn-amber .sub{color:#4a3000;}
.btn-crisis{background:linear-gradient(135deg, var(--crisis) 0%, var(--crisis-dim) 100%); color:#fff; border:none;}
.btn-crisis .sub{color:#ffd9d6;}
.btn-ghost{background:transparent; border:1px dashed var(--ink-line); color:var(--muted); font-weight:500;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}
.btn[disabled]{opacity:.4; pointer-events:none;}

/* ---------- main menu ---------- */
.menu-hero{
  padding:38px 24px 26px; text-align:center; position:relative; overflow:hidden;
}
.particle-field{position:absolute; inset:0; pointer-events:none; z-index:0;}
.particle{
  position:absolute; bottom:-10px; width:4px; height:4px; border-radius:50%;
  background:var(--teal); opacity:0; animation:floatUp linear infinite;
}
.particle:nth-child(odd){background:var(--gold);}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0); opacity:0;}
  10%{opacity:.55;}
  90%{opacity:.35;}
  100%{transform:translateY(-260px) translateX(var(--drift,10px)); opacity:0;}
}
.seal{width:118px; height:118px; margin:0 auto 14px; display:block; position:relative; z-index:1;
  animation:sealSpin 42s linear infinite;
  filter:drop-shadow(0 0 14px rgba(47,191,161,0.18));
}
@keyframes sealSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.menu-hero > .eyebrow, .menu-hero > .menu-title, .menu-hero > .menu-tag, .menu-hero > .menu-version{position:relative; z-index:1;}
@media (prefers-reduced-motion: reduce){
  .seal{animation:none;}
  .particle{animation:none; display:none;}
}
.menu-title{font-size:26px; font-weight:700; line-height:1.15; margin:0 0 6px;}
.menu-title span{color:var(--teal);}
.menu-tag{color:var(--muted); font-size:13px; max-width:400px; margin:0 auto; line-height:1.5;}
.menu-version{margin-top:14px; font-size:10px; letter-spacing:0.12em; color:var(--gold); text-transform:uppercase; font-family:'IBM Plex Mono',monospace;}
.menu-list{display:flex; flex-direction:column; gap:12px; padding:6px 20px 0;}
.world-strip{
  height:64px; margin:8px 0 0; position:relative; overflow:hidden;
  background:linear-gradient(180deg, transparent, rgba(47,191,161,0.06));
}
.world-strip svg{width:100%; height:100%; opacity:.55;}

/* ---------- cards ---------- */
.card{
  background:var(--navy); border:1px solid var(--ink-line); border-radius:var(--radius);
  padding:18px; margin-bottom:14px;
}
.card-title{font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center;}

/* ---------- setup / archetype pick ---------- */
.arche-card{
  border:1px solid var(--ink-line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;
  background:var(--navy); cursor:pointer; transition:all .15s ease;
}
.arche-card.selected{border-color:var(--teal); background:linear-gradient(135deg, rgba(47,191,161,0.14), var(--navy));}
.arche-card h3{margin:0 0 4px; font-size:16px;}
.arche-card p{margin:0 0 10px; font-size:12.5px; color:var(--muted); line-height:1.5;}
.stat-chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.stat-chip{font-family:'IBM Plex Mono',monospace; font-size:10.5px; background:rgba(255,255,255,0.06); border:1px solid var(--ink-line); border-radius:6px; padding:3px 7px; color:var(--muted);}

/* ---------- status bar (campaign) ---------- */
.status-strip{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;
}
.status-cell{
  background:var(--navy); border:1px solid var(--ink-line); border-radius:10px; padding:9px 8px; text-align:center;
}

 <circle cx="50" cy="50" r="46" stroke="#c9a227" stroke-width="2"/>
 <line x1="26" y1="70" x2="74" y2="26" stroke="#2fbfa1" stroke-width="8" stroke-linecap="round"/>

/* =========================================================
   STATE
   ========================================================= */
let state = { screen:'menu' };
function freshCampaign(archetypeId){
  const a = ARCHETYPES.find(x=>x.id===archetypeId);
  const schedule = [];
  for(let y=1;y<=10;y++){
    const chance = clamp(a.baseChance + y*0.02, 0, 0.9);
    if(Math.random() < chance){
      const type = weightedPick(a.weights);
      const sev = clamp(Math.round((2 + Math.random()*6 + y*0.35) * a.sevBias), 2, 12);
      schedule.push({year:y, type, sev, line: CRISIS_TYPES[type].lines[Math.floor(Math.random()*CRISIS_TYPES[type].lines.length)]});
    } else {
      schedule.push({year:y, type:null});
    }
  }
  return {
    archetype:a, year:1, schedule,
    budget: a.startBudget, reserve:10,
    horizontalCap: 12, verticalScore: 20,
    vertPct:34, horizPct:33,
    dalys:0, deaths:0, finRisk:0, collapses:0,
    baseline:{ dalys:0, deaths:0, finRisk:0, collapses:0 },
    log:[],
  };
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function weightedPick(weights){
  const entries = Object.entries(weights);
  const total = entries.reduce((s,[,w])=>s+w,0);
  let r = Math.random()*total;
  for(const [k,w] of entries){ if(r<w) return k; r-=w; }
  return entries[0][0];
}
function fmt(n){ return Math.round(n).toLocaleString(); }
function particleHTML(n){
  let out = '';
  for(let i=0;i<n;i++){
    const left = Math.round(Math.random()*100);
    const dur = (7 + Math.random()*9).toFixed(1);
    const delay = (Math.random()*10).toFixed(1);
    const drift = Math.round(-20 + Math.random()*40);
    out += `<span class="particle" style="left:${left}%; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}px;"></span>`;
  }
  return out;
}
function animateNumber(el, to, duration){
  if(!el) return;
  duration = duration || 700;
  const start = performance.now();
  const from = 0;
  function step(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = fmt(from + (to-from)*eased);
    if(p<1) requestAnimationFrame(step);
    else el.textContent = fmt(to);
  }
  requestAnimationFrame(step);
}
function animateBars(){
  document.querySelectorAll('.bar-fill[data-target-width]').forEach(el=>{
    const target = el.getAttribute('data-target-width');
    el.style.width = '0%';
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.style.width = target+'%'; }); });
  });
  document.querySelectorAll('.bar-num[data-target]').forEach(el=>{
    animateNumber(el, parseFloat(el.getAttribute('data-target')), 900);
  });
}

function showDispatch(){
  const c = state.campaign;

  const overlay = document.createElement('div');
  overlay.className = 'dispatch-overlay';

  const surgeCost = 0;
  const emerCost = ev.sev*4;

  const canBackup = c.reserve >= backupCost;
  const canEmergency = true;
  overlay.innerHTML = `

        <div>Reserve<b>${fmt(c.reserve)}</b></div>
      </div>

      <button class="dispatch-action ${canSurge?'rec':''}" data-act="surge">Deploy Surge Surgical Team
        <span class="sub">${canSurge?'Capacity ready — mitigation scales with your surgical infrastructure.':'Capacity below readiness threshold (50) — team deploys understaffed, mitigation halved.'}</span>
      </button>
      <button class="dispatch-action" data-act="backup" ${canBackup?'':'disabled'}>Activate NSOAP Backup Fund
        <span class="sub">${canBackup?`Draws ${backupCost} from reserve — strong, capacity-boosted mitigation.`:`Requires ${backupCost} in reserve — you have ${fmt(c.reserve)}.`}</span>
      </button>
      <button class="dispatch-action" data-act="emergency">Declare State of Emergency
        <span class="sub">High cost (${emerCost} units, drawn from reserve then absorbed as budget strain) — moderate flat mitigation.</span>
      </button>
      <button class="dispatch-action" data-act="none">Absorb Under-Resourced
        <span class="sub">No cost — but with minimal mitigation, casualties and financial risk will be severe.</span>
      </button>
    </div>`;
  document.getElementById('app').appendChild(overlay);
  overlay.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>resolveCrisis(btn.getAttribute('data-act'), ev));
  });
}

function resolveCrisis(action, ev){
  const c = state.campaign;
  let mitigation = 0, cost = 0;
  if(action==='surge'){
    mitigation = c.horizontalCap>=50 ? (0.25 + c.horizontalCap/130) : (0.12 + c.horizontalCap/260);
  } else if(action==='backup'){
    cost = ev.sev*3; c.reserve -= cost;
    mitigation = 0.5 + c.horizontalCap/250;
  } else if(action==='emergency'){
    cost = ev.sev*4; c.reserve = Math.max(0, c.reserve - cost);
    mitigation = 0.35 + c.horizontalCap/300;
  } else {
    mitigation = 0.05 + c.horizontalCap/400;
  }
  mitigation = clamp(mitigation, 0, 0.9);
  const deaths = Math.round(ev.sev*12*(1-mitigation));
  const dalys = Math.round(ev.sev*40*mitigation);
  const finRisk = Math.round(ev.sev*3*(1-mitigation));
  const collapse = mitigation < 0.3 && ev.sev >= 6;
  if(collapse){ c.horizontalCap = clamp(c.horizontalCap-15,0,100); c.collapses++; }
  c.deaths += deaths; c.dalys += dalys; c.finRisk += finRisk;

  // baseline (neglect path) computed in parallel off same event
  const baseMit = clamp(0.05 + 15/400, 0, 0.9);
  const bDeaths = Math.round(ev.sev*12*(1-baseMit));
  const bDalys = Math.round(ev.sev*40*baseMit);
  const bFin = Math.round(ev.sev*3*(1-baseMit));
  const bCollapse = baseMit < 0.3 && ev.sev >= 6;
  c.baseline.deaths += bDeaths; c.baseline.dalys += bDalys; c.baseline.finRisk += bFin;
  if(bCollapse) c.baseline.collapses++;

  state.lastOutcome = { type:'crisis', action, ev, mitigation, deaths, dalys, finRisk, collapse, t:CRISIS_TYPES[ev.type] };
  c.log.push(state.lastOutcome);
  state.crisisPending = false;
  state.screen = 'outcome';
  render();
}

/* =========================================================
   ALLOCATE CONFIRM → advance year (calm or crisis)
   ========================================================= */
function confirmAllocation(){
  const c = state.campaign;
  const vertAmt = Math.round(c.budget*c.vertPct/100);
  const horizAmt = Math.round(c.budget*c.horizPct/100);
  const resAmt = c.budget - vertAmt - horizAmt;
  c.horizontalCap = clamp(c.horizontalCap*0.9 + horizAmt*0.6, 0, 100);
  c.verticalScore = clamp(vertAmt*0.8, 0, 100);
  c.reserve += resAmt;
  const routineDalys = Math.round(c.verticalScore*0.3 + c.horizontalCap*0.15);
  c.dalys += routineDalys;

  const ev = c.schedule.find(e=>e.year===c.year);
  if(!ev.type){
    state.lastOutcome = { type:'calm', routineDalys };
    c.log.push(state.lastOutcome);
    state.screen = 'outcome';
    render();
  } else {
    state.crisisPending = true;
    state.screen = 'allocate'; // keep allocate behind the modal briefly; render() will show dispatch
    render();
  }
}

function proposeItem(id){
  state.summit.proposal = id;
  state.summit.phase = 'donor';
  render();

function decideItem(choice){
  const s = state.summit;
  const p = PROPOSALS.find(x=>x.id===s.proposal);
  let gain = 0, trustDelta = 0, note='';
  if(choice==='full'){ gain = 12*p.weight; trustDelta = 8; note='Approved in full.'; }
  else if(choice==='partial'){ gain = 6*p.weight; trustDelta = 2; note='Approved at 50%.'; }
  else { gain = 0; trustDelta = -10; note='Rejected.'; }
  s.infra = clamp(s.infra + gain, 0, 100);
  s.trust = clamp(s.trust + trustDelta, 0, 100);
  s.log.push({proposal:p.name, choice, gain:Math.round(gain)});
  s.round += 1;
  s.phase = 'minister';
  render();
}

  const s = state.summit;
  const mitigation = clamp(0.15 + s.infra/140, 0, 0.85);
  const sev = 7;
  const deaths = Math.round(sev*12*(1-mitigation));
  const dalys = Math.round(sev*40*mitigation);
  const good = mitigation >= 0.45;
  return `
  ${topbar('Stakeholder Summit')}
  <div class="screen">
    <div class="dispatch" style="position:static; margin-bottom:16px; border-radius:var(--radius);">
      <div class="dispatch-stamp">CRISIS</div>
      <div class="dispatch-eyebrow">🌊 Joint Stress Test</div>
      <h2>The negotiated infrastructure is tested by a severity-7 shock.</h2>
      <p>Combined surgical capacity built across three rounds: <b>${fmt(s.infra)}/100</b>. Final donor trust: <b>${fmt(s.trust)}/100</b>.</p>
      <hr>
      <p style="margin:0;"><b>${good?'System absorbs the shock.':'System strains under the shock.'}</b> Mitigation ${Math.round(mitigation*100)}% → ${fmt(deaths)} preventable deaths, ${fmt(dalys)} DALYs averted.</p>
    </div>
    <div class="report-narrative" style="background:var(--navy); border-left-color:var(--gold); color:var(--white);">
      ${good ? '<b>Negotiation succeeded.</b> Sustained horizontal investment across the summit produced durable, dual-use capacity — the case InciSioN makes to every donor table.' : '<b>Under-investment persisted.</b> Partial approvals and rejections left capacity too thin to absorb a real shock — the argument for institutionalized NSOAP financing, not one-off grants.'}
    </div>
    <button class="btn btn-primary" id="summitReplay" style="margin-top:14px;">Return to Main Menu →</button>
  </div>`;
}

/* =========================================================
   EVENT WIRING
   ========================================================= */
function attachHandlers(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.screen = el.getAttribute('data-go'); render(); });
  });
  const pickEls = document.querySelectorAll('[data-pick]');
  pickEls.forEach(el=>{
    el.addEventListener('click', ()=>{ state.pendingArchetype = el.getAttribute('data-pick'); render(); });
  });
  const startBtn = document.getElementById('startCampaign');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    state.campaign = freshCampaign(state.pendingArchetype);
    state.screen = 'allocate';
    render();
  });
  const vertSlider = document.getElementById('vertSlider');
  const horizSlider = document.getElementById('horizSlider');
  if(vertSlider && horizSlider){
    const sync = (moved)=>{
      const c = state.campaign;
      let v = parseInt(vertSlider.value), h = parseInt(horizSlider.value);
      if(v+h > 100){
        if(moved==='v') h = 100-v; else v = 100-h;
      }
      c.vertPct = v; c.horizPct = h;
      vertSlider.value = v; horizSlider.value = h;
      document.querySelectorAll('.slider-label b')[0].textContent = v+'%';
      document.querySelectorAll('.slider-label b')[1].textContent = h+'%';
      const res = 100-v-h;
      document.querySelector('.beam-fill-v').style.width = v+'%';
      document.querySelector('.beam-fill-h').style.width = h+'%';
      document.querySelector('.beam-fill-r').style.width = res+'%';
      const vertAmt = Math.round(c.budget*v/100), horizAmt = Math.round(c.budget*h/100), resAmt = c.budget-vertAmt-horizAmt;
      document.querySelector('.leg-v').textContent = '■ Vertical '+vertAmt;
      document.querySelector('.leg-h').textContent = '■ Horizontal '+horizAmt;
      document.querySelector('.leg-r').textContent = '▨ Reserve '+resAmt;
      document.getElementById('forecastBox').innerHTML = forecastText(c, v, h, res);
    };
    vertSlider.addEventListener('input', ()=>sync('v'));
    horizSlider.addEventListener('input', ()=>sync('h'));
  }
  const confirmAlloc = document.getElementById('confirmAlloc');
  if(confirmAlloc) confirmAlloc.addEventListener('click', confirmAllocation);
  const nextYearBtn = document.getElementById('nextYear');
  if(nextYearBtn) nextYearBtn.addEventListener('click', nextYear);
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportScorecard);
  const replayBtn = document.getElementById('replayBtn');
  if(replayBtn) replayBtn.addEventListener('click', ()=>{ state.screen='setup'; state.pendingArchetype=null; render(); });

  document.querySelectorAll('.flash').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('flipped'));
  });

  const beginSummit = document.getElementById('beginSummit');
  if(beginSummit) beginSummit.addEventListener('click', ()=>{ state.summit = freshSummit(); state.screen='summit_round'; render(); });
  document.querySelectorAll('[data-propose]').forEach(el=>{
    el.addEventListener('click', ()=>proposeItem(el.getAttribute('data-propose')));
  });
  document.querySelectorAll('[data-decide]').forEach(el=>{
    el.addEventListener('click', ()=>decideItem(el.getAttribute('data-decide')));
  });
  const summitReplay = document.getElementById('summitReplay');
  if(summitReplay) summitReplay.addEventListener('click', ()=>{ state.screen='menu'; render(); });

  document.querySelectorAll('.anim-num[data-count]').forEach(el=>{
    animateNumber(el, parseFloat(el.getAttribute('data-count')), 650);
  });
  animateBars();
}

render();
</script>

</html>
