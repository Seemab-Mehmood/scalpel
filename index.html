<style>
:root{
  /* ===== Official InciSioN logo palette only: navy blue + white =====
     Brand navy sampled directly from the logo artwork: #131C8E.
     Light theme: white page, navy ink — matches the logo's own look
     (navy line-art on a white/transparent field). Every other token
     below is a tint or shade of that single navy hue, or plain white. */
  --bg:#FFFFFF;            /* page background — white, like the logo field */
  --bg-soft:#F7F8FD;       /* faint navy-tinted surface (cards, chips) */
  --bg-soft-2:#EEF0FB;     /* slightly deeper tint (status cells, ledger) */
  --navy:#131C8E;          /* OFFICIAL LOGO NAVY — primary brand color */
  --navy-deep:#0E1568;     /* dark navy — headings, strong text */
  --navy-mid:#3945B8;      /* mid navy — label accents */
  --navy-light:#4652D6;    /* bright navy accent (was teal) */
  --navy-pale:#7480E4;     /* pale navy accent (was amber) */
  --line:#CFD3EF;          /* light navy hairline / border */
  --muted:#4A53A8;         /* muted navy secondary text */
  --text:#10165C;          /* primary body text — dark navy */
  --on-navy:#FFFFFF;       /* text placed on solid navy fills */
  --danger:#0A0F4A;        /* darkest navy — alert/danger accent (was crimson) */
  --danger-dim:#050830;    /* darkest navy dim */
  --radius:14px;
  font-family:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top, #F3F4FC 0%, #FFFFFF 55%);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#app{
  max-width:640px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; color:var(--navy-deep);}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--navy-mid);
}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--navy-light); color:var(--on-navy);}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

/* ---------- shared layout ---------- */
.screen{
  padding:22px 20px 100px;
  animation:fadeIn .35s ease;
  flex:1;
}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:20;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(6px);
}
.topbar .brand{display:flex; align-items:center; gap:9px;}
.topbar .brand img{width:26px; height:26px; display:block;}
.topbar .brand-name{font-size:13px; font-weight:600; letter-spacing:0.04em; color:var(--navy-deep);}
.topbar .brand-name small{display:block; font-size:9px; color:var(--muted); font-weight:400; letter-spacing:0.1em;}
.back-btn{
  background:none; border:1px solid var(--line); color:var(--muted);
  border-radius:8px; padding:6px 12px; font-size:12px;
}
.back-btn:hover{color:var(--navy-deep); border-color:var(--navy-mid);}

/* ---------- buttons ---------- */
.btn{
  display:block; width:100%; text-align:left; border:none; border-radius:12px;
  padding:16px 18px; font-size:15px; font-weight:600; color:var(--navy-deep);
  background:var(--bg-soft); border:1px solid var(--line);
  transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  position:relative; overflow:hidden;
  box-shadow:0 1px 2px rgba(19,28,142,0.05);
}
.btn:hover{transform:translateY(-1px); border-color:var(--navy-light); box-shadow:0 4px 10px rgba(19,28,142,0.1);}
.btn:active{transform:translateY(0px) scale(.99);}
.btn .sub{display:block; font-weight:400; font-size:12px; color:var(--muted); margin-top:3px;}
.btn-primary{
  background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
  color:var(--on-navy); border:none;
}
.btn-primary .sub{color:#c7cdf5;}
.btn-primary:hover{border-color:transparent; filter:brightness(1.12); box-shadow:0 6px 16px rgba(19,28,142,0.28);}
.btn-amber{background:linear-gradient(135deg, var(--navy-pale) 0%, var(--navy-mid) 100%); color:var(--on-navy); border:none;}
.btn-amber .sub{color:#e6e9fc;}
.btn-crisis{background:linear-gradient(135deg, var(--navy-deep) 0%, var(--danger) 100%); color:var(--on-navy); border:none;}
.btn-crisis .sub{color:#c7cdf5;}
.btn-ghost{background:transparent; border:1px dashed var(--line); color:var(--muted); font-weight:500;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}
.btn[disabled]{opacity:.4; pointer-events:none;}

/* ---------- main menu ---------- */
.menu-hero{
  padding:38px 24px 26px; text-align:center; position:relative; overflow:hidden;
}
.particle-field{position:absolute; inset:0; pointer-events:none; z-index:0;}
.particle{
  position:absolute; bottom:-10px; width:4px; height:4px; border-radius:50%;
  background:var(--navy-light); opacity:0; animation:floatUp linear infinite;
}
.particle:nth-child(odd){background:var(--navy-pale);}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0); opacity:0;}
  10%{opacity:.5;}
  90%{opacity:.3;}
  100%{transform:translateY(-260px) translateX(var(--drift,10px)); opacity:0;}
}
.seal{width:118px; height:118px; margin:0 auto 14px; display:block; position:relative; z-index:1;
  animation:sealSpin 42s linear infinite;
  filter:drop-shadow(0 6px 18px rgba(19,28,142,0.22));
  object-fit:contain;
}
@keyframes sealSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.menu-hero > .eyebrow, .menu-hero > .menu-title, .menu-hero > .menu-tag, .menu-hero > .menu-version{position:relative; z-index:1;}
@media (prefers-reduced-motion: reduce){
  .seal{animation:none;}
  .particle{animation:none; display:none;}
}
.menu-title{font-size:26px; font-weight:700; line-height:1.15; margin:0 0 6px; color:var(--navy-deep);}
.menu-title span{color:var(--navy);}
.menu-tag{color:var(--muted); font-size:13px; max-width:400px; margin:0 auto; line-height:1.5;}
.menu-version{margin-top:14px; font-size:10px; letter-spacing:0.12em; color:var(--navy-mid); text-transform:uppercase; font-family:'IBM Plex Mono',monospace;}
.menu-list{display:flex; flex-direction:column; gap:12px; padding:6px 20px 0;}
.world-strip{
  height:64px; margin:8px 0 0; position:relative; overflow:hidden;
  background:linear-gradient(180deg, transparent, rgba(19,28,142,0.06));
}
.world-strip svg{width:100%; height:100%; opacity:.55;}

/* ---------- cards ---------- */
.card{
  background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:14px;
}
.card-title{font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center;}

/* ---------- setup / archetype pick ---------- */
.arche-card{
  border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;
  background:var(--bg-soft); cursor:pointer; transition:all .15s ease;
}
.arche-card.selected{border-color:var(--navy-light); background:linear-gradient(135deg, rgba(19,28,142,0.08), var(--bg-soft));}
.arche-card h3{margin:0 0 4px; font-size:16px; color:var(--navy-deep);}
.arche-card p{margin:0 0 10px; font-size:12.5px; color:var(--muted); line-height:1.5;}
.stat-chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.stat-chip{font-family:'IBM Plex Mono',monospace; font-size:10.5px; background:rgba(19,28,142,0.06); border:1px solid var(--line); border-radius:6px; padding:3px 7px; color:var(--muted);}

/* ---------- status bar (campaign) ---------- */
.status-strip{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;
}
.status-cell{
  background:var(--bg-soft-2); border:1px solid var(--line); border-radius:10px; padding:9px 8px; text-align:center;
}
.status-cell .val{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; color:var(--navy-deep);}
.status-cell .lab{font-size:8.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-top:2px;}
.year-track{display:flex; gap:3px; margin-bottom:16px;}
.year-dot{flex:1; height:5px; border-radius:3px; background:var(--line);}
.year-dot.done{background:var(--navy-light);}
.year-dot.now{background:var(--navy-pale);}

/* ---------- ledger beam (signature element) ---------- */
.ledger{
  background:linear-gradient(180deg, var(--bg-soft-2) 0%, #E4E7FA 100%);
  border:1px solid var(--line); border-radius:var(--radius); padding:20px 18px 16px; margin-bottom:16px;
  position:relative;
}
.ledger::before{
  content:''; position:absolute; inset:0; border-radius:var(--radius); pointer-events:none;
  background-image:repeating-linear-gradient(180deg, rgba(19,28,142,0.025) 0px, rgba(19,28,142,0.025) 1px, transparent 1px, transparent 26px);
}
.ledger-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;}
.ledger-head h3{margin:0; font-size:15px; color:var(--navy-deep);}
.ledger-budget{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--navy);}
.beam-wrap{position:relative; padding:6px 0 2px;}
.beam-track{
  height:14px; border-radius:7px; overflow:hidden; display:flex; border:1px solid var(--line);
  box-shadow:inset 0 2px 4px rgba(19,28,142,0.12);
}
.beam-fill-h{background:linear-gradient(90deg, var(--navy-mid), var(--navy-light)); height:100%; transition:width .18s ease;}
.beam-fill-v{background:linear-gradient(90deg, var(--navy-pale), var(--navy)); height:100%; transition:width .18s ease;}
.beam-fill-r{background:repeating-linear-gradient(45deg, #D7DBF5, #D7DBF5 4px, #C7CDF5 4px, #C7CDF5 8px); height:100%; transition:width .18s ease;}
.beam-legend{display:flex; justify-content:space-between; font-size:10.5px; margin-top:8px; font-family:'IBM Plex Mono',monospace;}
.leg-h{color:var(--navy-light);} .leg-v{color:var(--navy-pale);} .leg-r{color:var(--muted);}
.slider-block{margin-top:16px;}
.slider-label{display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; color:var(--text);}
.slider-label b{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; color:var(--navy-deep);}
input[type=range]{
  -webkit-appearance:none; width:100%; height:6px; border-radius:3px; background:var(--line); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
  background:var(--bg); border:3px solid var(--navy-light); cursor:pointer; margin-top:-7px;
  box-shadow:0 2px 6px rgba(19,28,142,0.3);
}
input[type=range]#vertSlider::-webkit-slider-thumb{border-color:var(--navy-pale);}
input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--bg); border:3px solid var(--navy-light); cursor:pointer;}

.forecast{font-size:12px; color:var(--muted); background:rgba(19,28,142,0.05); border-radius:8px; padding:10px 12px; margin-top:14px; line-height:1.5;}
.forecast b{color:var(--navy-deep);}

/* ---------- dispatch / crisis bulletin (signature element) ---------- */
.dispatch-overlay{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:rgba(10,15,74,0.55); backdrop-filter:blur(3px); padding:20px;
  animation:fadeIn .25s ease;
}
.dispatch{
  max-width:440px; width:100%; background:var(--bg); color:var(--navy); border-radius:4px;
  padding:26px 24px 22px; position:relative; max-height:88vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(10,15,74,0.35);
  border:1px solid var(--line);
  animation:dispatchIn .4s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes dispatchIn{from{opacity:0; transform:translateY(30px) rotate(-1.2deg) scale(.96);} to{opacity:1; transform:translateY(0) rotate(0) scale(1);}}
.dispatch::before{
  content:''; position:absolute; inset:0; border-radius:4px; pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(19,28,142,0.45); animation:sirenPulse 1.6s ease-in-out infinite;
}
@keyframes sirenPulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(19,28,142,0.2);} 50%{box-shadow:inset 0 0 0 3px rgba(19,28,142,0.65);}}
.dispatch-stamp{
  position:absolute; top:14px; right:-6px; background:var(--navy); color:var(--on-navy); font-family:'Space Grotesk',sans-serif;
  font-weight:700; font-size:12px; letter-spacing:0.14em; padding:5px 14px; transform:rotate(6deg);
  box-shadow:0 3px 8px rgba(19,28,142,0.3);
}
.dispatch-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--navy-mid);}
.dispatch h2{font-size:21px; margin:6px 0 10px; line-height:1.2; color:var(--navy-deep);}
.dispatch p{font-size:13.5px; line-height:1.55; color:var(--text); margin:0 0 10px;}
.dispatch-meta{display:flex; gap:14px; margin:14px 0; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);}
.dispatch-meta b{display:block; font-size:15px; color:var(--navy-deep);}
.dispatch hr{border:none; border-top:1px dashed var(--line); margin:16px 0;}
.dispatch-action{
  display:block; width:100%; text-align:left; border-radius:8px; padding:12px 14px; margin-bottom:9px;
  border:1.5px solid var(--line); background:var(--bg-soft); font-weight:600; font-size:13.5px; color:var(--navy-deep);
}
.dispatch-action .sub{display:block; font-weight:400; font-size:11.5px; color:var(--muted); margin-top:3px;}
.dispatch-action:hover{border-color:var(--navy);}
.dispatch-action[disabled]{opacity:.45;}
.dispatch-action.rec::after{content:'RECOMMENDED'; float:right; font-size:9px; letter-spacing:0.08em; color:var(--navy-light); font-family:'IBM Plex Mono',monospace;}

/* ---------- outcome toast ---------- */
.outcome-card{
  border-radius:var(--radius); padding:18px; margin-bottom:16px; border:1px solid;
}
.outcome-good{background:linear-gradient(135deg, rgba(19,28,142,0.09), var(--bg-soft)); border-color:var(--navy-light);}
.outcome-bad{background:linear-gradient(135deg, rgba(10,15,74,0.1), var(--bg-soft)); border-color:var(--danger);}
.outcome-neutral{background:var(--bg-soft); border-color:var(--line);}
.outcome-metrics{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
.metric-pill{font-family:'IBM Plex Mono',monospace; font-size:11px; background:rgba(19,28,142,0.08); color:var(--navy-deep); border-radius:7px; padding:5px 9px;
  opacity:0; transform:translateY(6px) scale(.9); animation:pillPop .4s ease forwards;}
.metric-pill:nth-child(1){animation-delay:.05s;}
.metric-pill:nth-child(2){animation-delay:.15s;}
.metric-pill:nth-child(3){animation-delay:.25s;}
.metric-pill:nth-child(4){animation-delay:.35s;}
@keyframes pillPop{to{opacity:1; transform:translateY(0) scale(1);}}
.status-cell .val{transition:color .3s ease;}
.status-cell.pulse .val{animation:valPulse .5s ease;}
@keyframes valPulse{0%{color:var(--navy-light); transform:scale(1.12);} 100%{color:var(--navy-deep); transform:scale(1);}}
.status-cell .val{display:inline-block;}

/* ---------- scorecard ---------- */
.report{background:var(--bg); color:var(--navy); border-radius:var(--radius); padding:22px 20px; margin-bottom:16px; border:1px solid var(--line); box-shadow:0 2px 10px rgba(19,28,142,0.06);}
.report h2{margin:0 0 4px; font-size:19px; color:var(--navy-deep);}
.report .eyebrow2{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; color:var(--navy-mid); text-transform:uppercase;}
.compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px;}
.compare-col h4{font-size:12px; text-align:center; margin:0 0 10px; text-transform:uppercase; letter-spacing:0.05em;}
.compare-col.baseline h4{color:var(--danger);}
.compare-col.yours h4{color:var(--navy-light);}
.bar-row{margin-bottom:12px;}
.bar-row .bl{font-size:10.5px; color:var(--muted); margin-bottom:3px; font-family:'IBM Plex Mono',monospace;}
.bar-track{height:26px; background:var(--bg-soft-2); border-radius:5px; overflow:hidden; position:relative;}
.bar-fill{height:100%; border-radius:5px; transition:width .8s cubic-bezier(.2,.8,.2,1);}
.bar-fill.red{background:linear-gradient(90deg,#2A35A0,#0A0F4A);}
.bar-fill.green{background:linear-gradient(90deg,#7480E4,#4652D6);}
.bar-num{position:absolute; right:6px; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--navy-deep);}
.report-narrative{background:rgba(19,28,142,0.05); border-left:3px solid var(--navy); padding:12px 14px; border-radius:6px; font-size:13px; line-height:1.6; margin-top:14px; color:var(--text);}
.report-narrative b{color:var(--navy-deep);}

/* ---------- evidence / academy ---------- */
.flash{
  background:var(--bg-soft); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:14px;
  cursor:pointer; min-height:118px; display:flex; flex-direction:column; justify-content:center; position:relative;
  perspective:800px;
}
.flash .q{font-size:14.5px; font-weight:600; line-height:1.4; color:var(--navy-deep);}
.flash .a{font-size:13px; color:var(--navy-light); line-height:1.55; display:none; margin-top:8px;}
.flash.flipped .a{display:block;}
.flash.flipped .q{color:var(--muted); font-size:12px;}
.flash .src{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--navy-mid); margin-top:8px; display:none;}
.flash.flipped .src{display:block;}
.flash .tap{position:absolute; bottom:10px; right:14px; font-size:9.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}

/* ---------- summit ---------- */
.role-banner{
  text-align:center; padding:22px 16px; border-radius:var(--radius); margin-bottom:18px;
  border:1px solid var(--line);
}
.role-banner.minister{background:linear-gradient(135deg, rgba(70,82,214,0.14), var(--bg-soft));}
.role-banner.donor{background:linear-gradient(135deg, rgba(116,128,228,0.16), var(--bg-soft));}
.role-banner .role-icon{font-size:34px;}
.role-banner h2{margin:8px 0 2px; font-size:19px;}
.pass-note{font-size:12px; color:var(--muted);}

.footer-note{text-align:center; font-size:10.5px; color:var(--muted); padding:24px 20px 10px; line-height:1.6;}
.footer-note a{color:var(--navy-light);}

.site-footer{
  margin-top:22px; padding:22px 20px 26px; border-top:1px solid var(--line);
  text-align:center;
}
.site-footer .eyebrow{display:block; margin-bottom:8px;}
.site-footer .about-blurb{
  font-size:12px; color:var(--muted); line-height:1.65; max-width:460px; margin:0 auto 16px;
}
.social-row{
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:16px;
}
.social-chip{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.03em;
  color:var(--on-navy); background:var(--navy); border:1px solid var(--navy);
  border-radius:20px; padding:6px 12px; text-decoration:none;
  transition:background .15s ease, transform .15s ease;
}
.social-chip:hover{background:var(--navy-deep); transform:translateY(-1px);}
.footer-dev{font-size:12px; color:var(--navy-deep); margin-bottom:4px;}
.footer-dev a{color:var(--navy-light); text-decoration:none; border-bottom:1px dotted var(--navy-light);}
.footer-dev a:hover{border-bottom-style:solid;}
.footer-copy{font-size:10.5px; color:var(--muted);}

@media (max-width:380px){
  .status-strip{grid-template-columns:repeat(2,1fr);}
}
</style>

let state = { screen:'menu' };
function freshCampaign(archetypeId){
  const a = ARCHETYPES.find(x=>x.id===archetypeId);
  const schedule = [];
  for(let y=1;y<=10;y++){
    const chance = clamp(a.baseChance + y*0.02, 0, 0.9);
    if(Math.random() < chance){
      const type = weightedPick(a.weights);
      const sev = clamp(Math.round((2 + Math.random()*6 + y*0.35) * a.sevBias), 2, 12);
      schedule.push({year:y, type, sev, line: CRISIS_TYPES[type].lines[Math.floor(Math.random()*CRISIS_TYPES[type].lines.length)]});
    } else {
      schedule.push({year:y, type:null});
    }
  }
  return {
    archetype:a, year:1, schedule,
    budget: a.startBudget, reserve:10,
    horizontalCap: 12, verticalScore: 20,
    vertPct:34, horizPct:33,
    dalys:0, deaths:0, finRisk:0, collapses:0,
    baseline:{ dalys:0, deaths:0, finRisk:0, collapses:0 },
    log:[],
  };
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function weightedPick(weights){
  const entries = Object.entries(weights);
  const total = entries.reduce((s,[,w])=>s+w,0);
  let r = Math.random()*total;
  for(const [k,w] of entries){ if(r<w) return k; r-=w; }
  return entries[0][0];
}
function fmt(n){ return Math.round(n).toLocaleString(); }
function particleHTML(n){
  let out = '';
  for(let i=0;i<n;i++){
    const left = Math.round(Math.random()*100);
    const dur = (7 + Math.random()*9).toFixed(1);
    const delay = (Math.random()*10).toFixed(1);
    const drift = Math.round(-20 + Math.random()*40);
    out += `<span class="particle" style="left:${left}%; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}px;"></span>`;
  }
  return out;
}
function animateNumber(el, to, duration){
  if(!el) return;
  duration = duration || 700;
  const start = performance.now();
  const from = 0;
  function step(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = fmt(from + (to-from)*eased);
    if(p<1) requestAnimationFrame(step);
    else el.textContent = fmt(to);
  }
  requestAnimationFrame(step);
}
function animateBars(){
  document.querySelectorAll('.bar-fill[data-target-width]').forEach(el=>{
    const target = el.getAttribute('data-target-width');
    el.style.width = '0%';
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.style.width = target+'%'; }); });
  });
  document.querySelectorAll('.bar-num[data-target]').forEach(el=>{
    animateNumber(el, parseFloat(el.getAttribute('data-target')), 900);
  });
}

      </button>

        <span class="sub">No cost — but with minimal mitigation, casualties and financial risk will be severe.</span>
      </button>
    </div>`;

function resolveCrisis(action, ev){
  const c = state.campaign;
  let mitigation = 0, cost = 0;
  if(action==='surge'){
    mitigation = c.horizontalCap>=50 ? (0.25 + c.horizontalCap/130) : (0.12 + c.horizontalCap/260);
  } else if(action==='backup'){
    cost = ev.sev*3; c.reserve -= cost;
    mitigation = 0.5 + c.horizontalCap/250;
  } else if(action==='emergency'){
    cost = ev.sev*4; c.reserve = Math.max(0, c.reserve - cost);
    mitigation = 0.35 + c.horizontalCap/300;
  } else {
    mitigation = 0.05 + c.horizontalCap/400;
  }
  mitigation = clamp(mitigation, 0, 0.9);
  const deaths = Math.round(ev.sev*12*(1-mitigation));
  const dalys = Math.round(ev.sev*40*mitigation);
  const finRisk = Math.round(ev.sev*3*(1-mitigation));
  const collapse = mitigation < 0.3 && ev.sev >= 6;
  if(collapse){ c.horizontalCap = clamp(c.horizontalCap-15,0,100); c.collapses++; }
  c.deaths += deaths; c.dalys += dalys; c.finRisk += finRisk;

  // baseline (neglect path) computed in parallel off same event
  const baseMit = clamp(0.05 + 15/400, 0, 0.9);
  const bDeaths = Math.round(ev.sev*12*(1-baseMit));
  const bDalys = Math.round(ev.sev*40*baseMit);
  const bFin = Math.round(ev.sev*3*(1-baseMit));
  const bCollapse = baseMit < 0.3 && ev.sev >= 6;
  c.baseline.deaths += bDeaths; c.baseline.dalys += bDalys; c.baseline.finRisk += bFin;
  if(bCollapse) c.baseline.collapses++;

  state.lastOutcome = { type:'crisis', action, ev, mitigation, deaths, dalys, finRisk, collapse, t:CRISIS_TYPES[ev.type] };
  c.log.push(state.lastOutcome);
  state.crisisPending = false;
  state.screen = 'outcome';
  render();
}

/* =========================================================
   ALLOCATE CONFIRM → advance year (calm or crisis)
   ========================================================= */
function confirmAllocation(){
  const c = state.campaign;
  const vertAmt = Math.round(c.budget*c.vertPct/100);
  const horizAmt = Math.round(c.budget*c.horizPct/100);
  const resAmt = c.budget - vertAmt - horizAmt;
  c.horizontalCap = clamp(c.horizontalCap*0.9 + horizAmt*0.6, 0, 100);
  c.verticalScore = clamp(vertAmt*0.8, 0, 100);
  c.reserve += resAmt;
  const routineDalys = Math.round(c.verticalScore*0.3 + c.horizontalCap*0.15);
  c.dalys += routineDalys;

  const ev = c.schedule.find(e=>e.year===c.year);
  if(!ev.type){
    state.lastOutcome = { type:'calm', routineDalys };
    c.log.push(state.lastOutcome);
    state.screen = 'outcome';
    render();
  } else {
    state.crisisPending = true;
    state.screen = 'allocate'; // keep allocate behind the modal briefly; render() will show dispatch
    render();
  }
}

    <div class="eyebrow">Multiplayer · Pass-and-Play</div>
    <h2 style="margin:4px 0 4px;">Two seats, one negotiation</h2>
    <p style="color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 18px;">Player One plays the <b style="color:var(--teal)">Minister of Health</b>, requesting investment across three rounds. Player Two plays the <b style="color:var(--amber)">Global Donor</b>, deciding what to fund. Pass the device between turns. A shared crisis stress-test decides the outcome.</p>
    <button class="btn btn-primary" id="beginSummit">Begin Summit →</button>
  </div>`;
}
function viewSummitRound(){
  const s = state.summit;
  if(s.round > 3){ state.screen = 'summit_final'; return viewSummitFinal(); }
  if(s.phase==='minister'){
    return `
    ${topbar('Stakeholder Summit')}
    <div class="screen">
      <div class="role-banner minister"><div class="role-icon">🏛️</div><h2>Minister of Health</h2><div class="pass-note">Round ${s.round} of 3 — choose your ask</div></div>
      ${PROPOSALS.map(p=>`
        <button class="btn" data-propose="${p.id}" style="margin-bottom:10px;">${p.name}
          <span class="sub">Strengthens ${p.unit}</span>
        </button>`).join('')}
      <div class="footer-note" style="padding-top:10px;">Trust so far: ${s.trust}/100 · Infrastructure so far: ${s.infra}/100</div>
    </div>`;
  } else {
    const p = PROPOSALS.find(x=>x.id===s.proposal);
    return `
    ${topbar('Stakeholder Summit')}
    <div class="screen">
      <div class="role-banner donor"><div class="role-icon">🌍</div><h2>Global Donor</h2><div class="pass-note">Round ${s.round} of 3 — pass the device</div></div>
      <div class="card">
        <div class="card-title">Request Received</div>
        <p style="margin:0; font-size:14px; font-weight:600;">${p.name}</p>
        <p style="margin:6px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5;">The Ministry argues this strengthens ${p.unit} — durable, dual-use capacity per the NSOAP evidence base.</p>
      </div>
      <button class="btn btn-primary" data-decide="full" style="margin-bottom:10px;">Approve in Full<span class="sub">Strong infrastructure gain · builds trust</span></button>
      <button class="btn btn-amber" data-decide="partial" style="margin-bottom:10px;">Approve Partial (50%)<span class="sub">Moderate gain · budget constraints cited</span></button>
      <button class="btn btn-crisis" data-decide="reject">Reject<span class="sub">No gain this round · trust falls</span></button>
    </div>`;
  }
}
function proposeItem(id){
  state.summit.proposal = id;
  state.summit.phase = 'donor';
  render();
}
function decideItem(choice){
  const s = state.summit;
  const p = PROPOSALS.find(x=>x.id===s.proposal);
  let gain = 0, trustDelta = 0, note='';
  if(choice==='full'){ gain = 12*p.weight; trustDelta = 8; note='Approved in full.'; }
  else if(choice==='partial'){ gain = 6*p.weight; trustDelta = 2; note='Approved at 50%.'; }
  else { gain = 0; trustDelta = -10; note='Rejected.'; }
  s.infra = clamp(s.infra + gain, 0, 100);
  s.trust = clamp(s.trust + trustDelta, 0, 100);
  s.log.push({proposal:p.name, choice, gain:Math.round(gain)});
  s.round += 1;
  s.phase = 'minister';
  render();
}

function viewSummitFinal(){
  const s = state.summit;
  const mitigation = clamp(0.15 + s.infra/140, 0, 0.85);
  const sev = 7;
  const deaths = Math.round(sev*12*(1-mitigation));
  const dalys = Math.round(sev*40*mitigation);
  const good = mitigation >= 0.45;
  return `
  ${topbar('Stakeholder Summit')}
  <div class="screen">
    <div class="dispatch" style="position:static; margin-bottom:16px; border-radius:var(--radius);">
      <div class="dispatch-stamp">CRISIS</div>
      <div class="dispatch-eyebrow">🌊 Joint Stress Test</div>
      <h2>The negotiated infrastructure is tested by a severity-7 shock.</h2>
      <p>Combined surgical capacity built across three rounds: <b>${fmt(s.infra)}/100</b>. Final donor trust: <b>${fmt(s.trust)}/100</b>.</p>
      <hr>
      <p style="margin:0;"><b>${good?'System absorbs the shock.':'System strains under the shock.'}</b> Mitigation ${Math.round(mitigation*100)}% → ${fmt(deaths)} preventable deaths, ${fmt(dalys)} DALYs averted.</p>
    </div>
    <div class="report-narrative" style="background:var(--navy-2); border-left-color:var(--gold); color:var(--white);">
      ${good ? '<b>Negotiation succeeded.</b> Sustained horizontal investment across the summit produced durable, dual-use capacity — the case InciSioN makes to every donor table.' : '<b>Under-investment persisted.</b> Partial approvals and rejections left capacity too thin to absorb a real shock — the argument for institutionalized NSOAP financing, not one-off grants.'}
    </div>
    <button class="btn btn-primary" id="summitReplay" style="margin-top:14px;">Return to Main Menu →</button>
  </div>`;
}

/* =========================================================
   EVENT WIRING
   ========================================================= */
function attachHandlers(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.screen = el.getAttribute('data-go'); render(); });
  });
  const pickEls = document.querySelectorAll('[data-pick]');
  pickEls.forEach(el=>{
    el.addEventListener('click', ()=>{ state.pendingArchetype = el.getAttribute('data-pick'); render(); });
  });
  const startBtn = document.getElementById('startCampaign');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    state.campaign = freshCampaign(state.pendingArchetype);
    state.screen = 'allocate';
    render();
  });
  const vertSlider = document.getElementById('vertSlider');
  const horizSlider = document.getElementById('horizSlider');
  if(vertSlider && horizSlider){
    const sync = (moved)=>{
      const c = state.campaign;
      let v = parseInt(vertSlider.value), h = parseInt(horizSlider.value);
      if(v+h > 100){
        if(moved==='v') h = 100-v; else v = 100-h;
      }
      c.vertPct = v; c.horizPct = h;
      vertSlider.value = v; horizSlider.value = h;
      document.querySelectorAll('.slider-label b')[0].textContent = v+'%';
      document.querySelectorAll('.slider-label b')[1].textContent = h+'%';
      const res = 100-v-h;
      document.querySelector('.beam-fill-v').style.width = v+'%';
      document.querySelector('.beam-fill-h').style.width = h+'%';
      document.querySelector('.beam-fill-r').style.width = res+'%';
      const vertAmt = Math.round(c.budget*v/100), horizAmt = Math.round(c.budget*h/100), resAmt = c.budget-vertAmt-horizAmt;
      document.querySelector('.leg-v').textContent = '■ Vertical '+vertAmt;
      document.querySelector('.leg-h').textContent = '■ Horizontal '+horizAmt;
      document.querySelector('.leg-r').textContent = '▨ Reserve '+resAmt;
      document.getElementById('forecastBox').innerHTML = forecastText(c, v, h, res);
    };
    vertSlider.addEventListener('input', ()=>sync('v'));
    horizSlider.addEventListener('input', ()=>sync('h'));
  }
  const confirmAlloc = document.getElementById('confirmAlloc');
  if(confirmAlloc) confirmAlloc.addEventListener('click', confirmAllocation);
  const nextYearBtn = document.getElementById('nextYear');
  if(nextYearBtn) nextYearBtn.addEventListener('click', nextYear);
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportScorecard);
  const replayBtn = document.getElementById('replayBtn');
  if(replayBtn) replayBtn.addEventListener('click', ()=>{ state.screen='setup'; state.pendingArchetype=null; render(); });

  document.querySelectorAll('.flash').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('flipped'));
  });

  const beginSummit = document.getElementById('beginSummit');
  if(beginSummit) beginSummit.addEventListener('click', ()=>{ state.summit = freshSummit(); state.screen='summit_round'; render(); });
  document.querySelectorAll('[data-propose]').forEach(el=>{
    el.addEventListener('click', ()=>proposeItem(el.getAttribute('data-propose')));
  });
  document.querySelectorAll('[data-decide]').forEach(el=>{
    el.addEventListener('click', ()=>decideItem(el.getAttribute('data-decide')));
  });
  const summitReplay = document.getElementById('summitReplay');
  if(summitReplay) summitReplay.addEventListener('click', ()=>{ state.screen='menu'; render(); });

  document.querySelectorAll('.anim-num[data-count]').forEach(el=>{
    animateNumber(el, parseFloat(el.getAttribute('data-count')), 650);
  });
  animateBars();
}

render();
</script>
</body>
</html>
